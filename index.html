:root{
  --stage:#ECEAE6; --stage-ink:#1b1b1b; --stage-mute:#6a665f; --stage-card:#ffffff; --stage-line:#dcd8d1; --stage-acc:#c45c00;
  --f:"Ravagh","Vazirmatn",Tahoma,sans-serif;
  --mute:#737373; --mute2:#737373; --ink:#000; --ink2:#323232; --paper:#fff; --line:#ededed; --soft:#f5f5f5; --soft2:#f9f9f9; --soft3:#f6f6f6; --y:#ffb300; --or:#e26a00;
  --dark:#000;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#121211;--stage-ink:#f1efea;--stage-mute:#a7a299;--stage-card:#1e1d1b;--stage-line:#33312d;--stage-acc:#ff9a3c;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#121211;--stage-ink:#f1efea;--stage-mute:#a7a299;--stage-card:#1e1d1b;--stage-line:#33312d;--stage-acc:#ff9a3c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--stage);color:var(--stage-ink);font-family:var(--f);direction:rtl;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid #e26a00;outline-offset:2px}
.wrap{display:grid;grid-template-columns:minmax(0,300px) 410px;gap:44px;justify-content:center;align-items:start;max-width:1000px;margin:0 auto}
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px;min-width:0;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin;padding-left:4px}
.side h1{margin:0;font-size:24px;font-weight:900}
.side p{margin:0;font-size:13px;line-height:1.9;color:var(--stage-mute)}
.chg{background:var(--stage-card);border-radius:14px;padding:12px 14px;border:1px solid var(--stage-line)}
.chg b{display:block;font-size:12px;color:var(--stage-acc);margin-bottom:4px;letter-spacing:.2px}
.chg ul{margin:0;padding:0 16px 0 0;font-size:12.5px;line-height:1.9}
.grp-t{font-size:11.5px;font-weight:700;color:var(--stage-mute);margin:6px 0 2px}
.idx{display:flex;flex-direction:column;gap:2px}
.idx button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;font-size:13.5px;width:100%}
.idx button:hover{background:color-mix(in oklab,var(--stage-card) 60%,transparent)}
.idx button.on{background:var(--stage-card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.idx button small{font-size:10.5px;padding:1px 7px;border-radius:20px;background:color-mix(in oklab,var(--stage-acc) 14%,transparent);color:var(--stage-acc);font-weight:700}

/* ===== phone ===== */
.device{width:410px;max-width:100%;padding:10px;border-radius:52px;background:#141414;box-shadow:0 30px 60px -24px rgba(0,0,0,.45)}
.phone{width:390px;max-width:100%;height:844px;border-radius:40px;overflow:hidden;background:var(--paper);color:var(--ink);position:relative;display:flex;flex-direction:column;font-family:var(--f);color-scheme:light}
.sbar{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:21px 32px 19px 38px;direction:ltr;background:var(--paper);position:relative;z-index:8;font:500 17px -apple-system,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.3px}
.sbar.tr{background:transparent;position:absolute;inset:0 0 auto 0}
.sbar svg{display:block}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;background:var(--paper)}
.scr::-webkit-scrollbar{display:none}
.hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:100px;background:var(--ink);z-index:60;pointer-events:none}
.ic{width:24px;height:24px;display:block;flex:none}
.i16 .ic{width:16px;height:16px}.i20 .ic{width:20px;height:20px}.i32 .ic{width:32px;height:32px}.i40 .ic{width:40px;height:40px}
.px{padding:0 16px}
.tn{font-feature-settings:"tnum"}
.hit{position:relative}.hit::after{content:"";position:absolute;inset:-10px}

.hdr{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--paper);position:sticky;top:0;z-index:6;direction:ltr}
.hbtn{width:48px;height:48px;border-radius:48px;border:1px solid var(--line);display:grid;place-items:center;color:#323232;flex:none;background:var(--paper);position:relative}
.hbtn.ghost{visibility:hidden}
.htitle{font-size:17px;font-weight:500;direction:rtl}
.logo{font-size:21px;font-weight:600;line-height:1;direction:rtl}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:20px;background:var(--or);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}

.btn{height:48px;border-radius:48px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.lg{height:52px;border-radius:80px}
.btn.out{background:var(--paper);color:var(--ink);border:1px solid #d9d9d9;height:50px}
.btn.y{background:#eba500}
.btn.red{background:var(--paper);color:#c62f29;border:1px solid #f0c3c0;height:50px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn .sep{width:1px;height:18px;background:currentColor;opacity:.4}
.lbl{font-size:13.5px;font-weight:500;color:var(--mute)}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid #bdbdbd;display:grid;place-items:center;flex:none}
.radio.on{border-color:var(--ink)}.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.radio.w{border-color:#fff}.radio.w.on::after{background:var(--paper)}

.dock{position:absolute;inset:auto 0 0 0;padding:28px 16px 40px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 32%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:7}
.earn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#6b4e00;background:linear-gradient(135deg,#fff8e4,#f6e3a8);border-radius:30px;padding:5px 12px 5px 14px}
.earn .ic{width:18px;height:18px;color:#c9961a}

.tabbar{position:absolute;inset:auto 0 0 0;height:106px;padding:13px 24px 0;display:flex;gap:16px;direction:ltr;z-index:9;pointer-events:none}
.tabbar>*{pointer-events:auto}
.pill{width:280px;height:60px;border-radius:296px;background:rgba(255,255,255,.7);box-shadow:0 8px 40px rgba(0,0,0,.12),inset 0 0 0 1px rgba(255,255,255,.6);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);display:flex;align-items:center;padding:4px 2px}
.pill .tab{flex:1;height:52px;border-radius:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:#1a1a1a;margin:0 -4px}
.pill .tab.on{background:var(--line);color:#e26a00;font-weight:600}
.sbtn{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 8px 40px rgba(0,0,0,.12),inset 0 0 0 1px rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;color:#1a1a1a;margin-top:-1px;position:relative}
.sbtn.full{background:var(--ink);color:#fff}
.sbtn .badge{top:2px;right:2px}

/* home */
.hh{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 16px;direction:ltr}
.pts{display:flex;align-items:center;gap:8px;height:24px}
.pts .ic{color:#ffad2f}
.pts span{font-size:12px;font-weight:500;color:#666;direction:rtl;display:flex;gap:4px;align-items:baseline}
.pts b{font-size:16px;color:var(--ink)}
.brand{display:flex;flex-direction:column;align-items:flex-end;gap:12px;padding:4px 8px 4px 0}
.brline{display:flex;align-items:center;gap:8px;font-size:16px;direction:rtl}
.brline .ic{width:16px;height:16px;transform:rotate(-90deg)}
.dot6{width:6px;height:6px;border-radius:50%;background:#33c007}
.wstrip{min-height:56px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;padding:8px;gap:8px}
.wstrip .wl{display:flex;align-items:center;gap:12px;text-align:right}
.wbox{width:40px;height:40px;border-radius:8px;background:#e4e4e4;display:grid;place-items:center}
.wtxt{display:flex;flex-direction:column;font-size:12px;font-weight:500;color:#666;line-height:1.35}
.wtxt b{font-size:17px;color:var(--ink);font-weight:600}
.wtxt em{font-style:normal;display:flex;gap:4px;align-items:baseline}
.charge{height:40px;border-radius:12px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;background:var(--paper)}
.home-c{display:flex;flex-direction:column;gap:24px;padding:16px 16px 140px}

.cm{padding:20px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}

 <div class="hh">${S.auth?`<button class="pts" data-go="points"><span>${i('star')}</span><span><b class="tn">${fd(S.points)}</b>امتیاز</span></button>`:`<button class="pts" data-gologin style="font-size:14px;font-weight:600">ورود / عضویت</button>`}
  <div class="brand"><span class="logo">کافه لئو</span><button class="brline" data-go="branch">${BR[S.branch].n}${i('chev')}</button></div></div>
 <div class="home-c">
  ${S.auth?`<div class="wstrip"><button class="wl" data-go="wallet"><span class="wbox">${i('walletBold')}</span><span class="wtxt"><span>موجودی کیف پول</span><em><b class="tn">${money(S.wallet)}</b>تومان</em></span></button><button class="charge" data-go="addfund">شارژ${i('add')}</button></div>`
   :`<div class="wstrip"><span class="wl"><span class="wbox">${i('walletBold')}</span><span class="wtxt" style="font-size:13px;color:var(--ink2)">عضو شو، از هر خرید<br>امتیاز بگیر</span></span><button class="charge" data-gologin>ورود</button></div>`}
  ${S.auth?(()=>{const n=nextRw(),r=S.routines.findIndex(x=>x.on);return `${r>-1?`<div class="hnext" role="button" tabindex="0" data-go="routines">${i('clock')}<span class="m tn">${S.routines[r].skip?'فردا رد می‌شه · ':'فردا ساعت '+ft(S.routines[r].time)+' · '}${P[S.routines[r].lines[0].id].n}</span><button data-rskip="${r}">${S.routines[r].skip?'برگردون':'رد کردن فردا'}</button></div>`:''}${n?`<button class="hrw" data-go="points"><span class="t">${i('star')}<span class="tn"><b>${fd(n[3]-S.points)}</b> امتیاز تا ${n[1]}</span></span><span class="bar"><i style="width:${S.points/n[3]*100}%"></i></span></button>`:''}`})():''}
  ${orderCard()}
  <div class="slider" id="sl">${[`<button class="banner bimg" data-catgo="shake"><img src="${IMG.bn1}" alt="پروتئینه‌ها، بعد تمرین خوشمزه‌ترن. کد تخفیف Liu10"></button>`,`<button class="banner bimg" data-catgo="iced"><img src="${IMG.bn2}" alt="خنک بنوش بیشتر کیف کن! قهوه‌های سرد با تخفیف ویژه. کد تخفیف Liu20"></button>`].join('')}</div>
  <div class="dots" aria-hidden="true"><i class="on"></i><i></i></div>
  <div class="cats">${CATS.map(([n,k,c])=>`<button class="cat" data-catgo="${c}"><span class="cb"><img src="${IMG[k]}" alt=""></span>${n}</button>`).join('')}</div>
  <div class="sec"><h2>همون همیشگی<button data-tab="menu">همه</button></h2>
   ${S.auth&&S.history[0]&&!(S.order&&S.order.step<3)?`<div class="again2"><span>سفارش قبلی: ${S.history[0].lines.map(l=>P[l.id].n).join('، ')}</span><button data-reorder="0">تکرار</button></div>`:''}
   <div class="hs" style="gap:10px">${['m5','m1','m3','m2','m6','m4'].map(mini).join('')}</div></div>
  <div class="sec mood2"><h2>الان چی می‌چسبه؟<span class="sub">حالت رو بگو، پیشنهاد با ما</span></h2>
   <div class="mgrid2">${MOODS.map(([t,k,c,ids],n)=>`<button class="mt2" data-mood="${n}" style="--mbg:${MBG[n]};--mink:${c}"><img src="${IMG[k]}" alt=""><span class="mtx"><b>${t.replace('<br>',' ')}</b><span class="tn">${fd(ids.length)} پیشنهاد</span></span></button>`).join('')}</div></div>
  <div class="sec"><h2>پک های این هفته</h2><div class="hs" style="gap:16px">${['m9','m10'].map(packCard).join('')}</div></div>
 </div></div>${tabbar('home')}`;
function mini(id){const p=P[id];return `<div class="mini">${pimg(id).replace('class="pimg','class="pimg sm')}<span class="nm">${p.n}</span><span class="desc">${p.d}</span><span class="pr tn">${T(p.p)}</span></div>`}
function vrow(id){const p=P[id],q=qtyOfId(id);return `<div class="vrow"><span class="th"><img src="${IMG[p.img]}" alt=""></span><span class="m"><b>${p.n}</b><span class="desc">${p.d}</span><span class="pr tn">${T(p.p)}</span></span>${q?`<span class="qty"><button class="${q===1?'del':''}" data-dec="${id}" aria-label="یکی کمتر">${q===1?i('trash'):i('minus')}</button><span class="tn">${fd(q)}</span><button data-add="${id}" aria-label="یکی بیشتر">${i('add')}</button></span>`:`<button class="pl" data-add="${id}" aria-label="افزودن ${p.n}">${i('plusW')}</button>`}</div>`}
function pcard(id){const p=P[id];return `<div class="pc">${pimg(id)}<span class="nm">${p.n}</span><span class="pr tn">${T(p.p)}</span></div>`}
function packCard(id){const p=P[id];return `<div class="pack">${pimg(id)}<div class="t"><div><b>${p.n}</b><span>${p.desc}</span></div><div class="prow tn">${T(p.p)} <span class="old">${money(p.old)}</span></div></div></div>`}
function dcard(id){const p=P[id];return `<div class="pc dpc">${pimg(id)}<span class="nm">${p.n}</span><span class="pr2 tn"><span class="num">${money(p.p)}</span><small>تومان</small>${p.old?`<span class="old">${money(p.old)}</span>`:''}</span></div>`}

V.menu=()=>{const q=norm(S.q);const all=S.showCats&&!q;
 const list=Object.keys(P).filter(id=>q?norm(P[id].n+' '+P[id].tags).includes(q):(all||P[id].g===S.cat));
 return `${sbar()}<div class="scr"><div class="mtop${all?'':' sc'}"><div class="mhdr"><label class="sfield">${i('search')}<input id="q" placeholder="دنبال چی میگردی" value="${S.q}" aria-label="جست‌وجو در منو">${S.q?`<button data-clearq aria-label="پاک کردن" style="color:var(--mute)">${i('x')}</button>`:''}</label>${backBtn.replace('data-back','data-tab="home"')}</div>
 ${q?'':`<div class="chips${all?' cx':''}"><button class="chip${all?' on':''}" data-cat="all">همه</button>${GORD.map(k=>`<button class="chip${!all&&S.cat===k?' on':''}" data-cat="${k}">${GN[k]}</button>`).join('')}</div>`}</div>
 ${all?`<div class="cgrid cats">${CATS.map(([n,k,c])=>`<button class="cat" data-cat="${c}"><span class="cb"><img src="${IMG[k]}" alt=""></span>${n}</button>`).join('')}</div>
`:''}
 ${q?`<div class="px" style="padding-top:12px;font-size:13px;color:var(--mute)">${fd(list.length)} نتیجه برای «${S.q}»</div>`:''}
 ${!q&&all?GORD.map(g=>{const L2=list.filter(id=>P[id].g===g);return L2.length?`<h3 class="gsec" id="g_${g}">${GN[g]}<span class="tn">${fd(L2.length)}</span></h3><div class="grid2 gs">${L2.map(gcard).join('')}</div>`:''}).join('')+'<div style="height:calc(var(--tbh) + var(--sab) + 80px)"></div>':`<div class="grid2">${list.length?list.map(gcard).join(''):`<div class="empty" style="grid-column:1/-1"><span class="eb">${i('search')}</span><b>نتیجه‌ای پیدا نشد</b><p>یه اسم دیگه امتحان کن، مثلاً «قهوه» یا «شیک».</p></div>`}</div>`}</div>${cartbar()}${tabbar('menu')}`};
function gcard(id){const p=P[id];return `<div class="gc">${pimg(id)}<span class="nm">${p.n}</span><span class="pp tn"><b>${money(p.p)}</b><small>تومان</small>${p.old?`<span class="old" style="font-size:12px">${money(p.old)}</span>`:''}</span></div>`}

V.cart=()=>{const L=lines();
 return `${sbar()}<div class="scr">${hdr('سبد خرید',{left:L.length?`<button class="hbtn" data-sheet="confirmClear" aria-label="خالی کردن سبد" style="color:#c62f29">${i('trash')}</button>`:'',right:backBtn})}
 <div class="px" style="display:flex;flex-direction:column;gap:22px;padding-top:12px;padding-bottom:200px">
 ${L.length?`<div class="items">${L.map(l=>{const p=P[l.id];const ad=l.add.map(k=>ADDONS[k][0]).join('، ');return `<div class="ci"><span class="th"><img src="${IMG[p.img]}" alt=""></span><span class="m"><b>${p.n}</b>${P[l.id].addons?`<button class="adl" data-edadd="${l.k}">${ad?'+ '+ad+' · تغییر':'افزودنی؟'}</button>`:''}<span class="pz tn"><b>${money(l.t)}</b> تومان</span></span><span class="qty"><button class="${l.q===1?'del':''}" data-ldec="${l.k}" aria-label="${l.q===1?'حذف':'یکی کمتر'}">${l.q===1?i('trash'):i('minus')}</button><span class="tn">${fd(l.q)}</span><button data-linc="${l.k}" aria-label="یکی بیشتر">${i('add')}</button></span></div>`}).join('')}</div>
 <label class="note"><span class="lbl">یادداشت برای باریستا <span style="font-weight:400">(اختیاری)</span></span><textarea id="noteIn" maxlength="80" placeholder="مثلاً شکر کم، بدون نی">${S.note||''}</textarea></label>
 <button class="tgl" data-tab="menu" style="background:var(--soft2)"><span class="t"><b style="font-size:14px">افزودن آیتم دیگر</b><span>سبدت حفظ می‌شه</span></span>${i('plusFill')}</button>
 ${S.codeOn?`<div class="dcode ok"><span class="r"><span style="color:#13804b">${i('tag')}</span><span><b>کد <span class="lat">${S.codeOn}</span> اعمال شد</b><span>${disc()?'−'+T(disc()):`از ${T(CODES[S.codeOn].min)} به بالا فعال می‌شه`}</span></span></span><button class="pl" data-coderm aria-label="حذف کد">${i('x')}</button></div>`
 :S.codeOpen?`<div class="dcode"><span class="r">${i('tag')}<input id="codeIn" placeholder="کد تخفیف" value="${S.code}" aria-label="کد تخفیف" autocapitalize="characters"></span><button class="pl dark" data-codeapply>ثبت</button></div>${S.codeErr?`<span class="cerr">${S.codeErr}</span>`:''}`
 :`<button class="dcode" data-codeopen><span class="r">${i('tag')}<span><b>کد تخفیف داری؟</b><span>${S.auth?'کد فعال: <span class="lat">LEO20</span>':'کد تخفیف رو وارد کن'}</span></span></span><span class="pl">${i('add')}</span></button>`}
 <div class="sum tn"><div><span>جمع سفارش</span><span><b>${money(subtotal())}</b> تومان</span></div>${disc()?`<div class="g"><span style="color:var(--ink)">تخفیف</span><span><b>−${money(disc())}</b> تومان</span></div>`:''}<hr><div class="t"><span><b style="font-size:14px;font-weight:500">قابل پرداخت</b></span><span><b>${money(payable())}</b> تومان</span></div></div>`
 :`<div class="empty"><span class="eb">${i('walletBold')}</span><b>سبد خرید خالیه</b><p>از منو یه نوشیدنی انتخاب کن.</p>${S.history.length&&S.auth?`<button class="btn" data-reorder="0" style="width:230px">تکرار سفارش قبلی</button>`:''}<button class="btn out" data-tab="menu" style="width:230px">مشاهده منو</button></div>`}
 </div></div>${L.length?`<div class="dock"><span class="earn">${S.auth?`${fd(earn())} امتیاز دریافت می‌کنی`:'با ورود، از این خرید امتیاز می‌گیری'}${i('coins')}</span><button class="btn" data-tocheckout>${S.auth?'ادامه و پرداخت':'ورود و پرداخت'}<span class="sep"></span><span class="tn">${T(payable())}</span></button></div>`:''}`};

function payState(){const need=payable();const sh=Math.max(0,need-S.wallet);return {need,sh,enough:sh===0}}
function carFormHTML(inline){const f=S.carForm;return `
 <div class="fld"><span class="lbl">مدل خودرو</span><label class="inp">${i('car')}<input id="carM" placeholder="مثلاً پژو ۲۰۶" value="${f.m}"></label></div>
 <div class="fld"><span class="lbl">رنگ</span><div class="swr">${COLORS.map(([n,c])=>`<button class="${f.c===n?'on':''}" data-color="${n}"><i style="background:${c}"></i>${n}</button>`).join('')}</div></div>
 <div class="fld"><span class="lbl">پلاک</span><div class="plate tn"><input id="pA" inputmode="numeric" maxlength="2" value="${f.p[0]}" placeholder="۵۵" aria-label="دو رقم اول"><span class="let"><select id="pL" aria-label="حرف پلاک">${['الف','ب','پ','ت','ج','د','س','ص','ط','ق','ل','م','ن','و','ه','ی'].map(x=>`<option${f.p[1]===x?' selected':''}>${x}</option>`).join('')}</select>${i('chev')}</span><input id="pB" class="l3" inputmode="numeric" maxlength="3" value="${f.p[2]}" placeholder="۵۵۵" aria-label="سه رقم"><input id="pC" class="reg" inputmode="numeric" maxlength="2" value="${f.p[3]}" placeholder="۱۵" aria-label="کد ایران"></div>${S._carErr?`<span class="ferr">${S._carErr}</span>`:''}</div>`}
V.checkout=()=>{const ps=payState();const needCar=S.method==='car'&&!S.cars.length;
 const btnTxt=needCar?'ابتدا خودرو رو اضافه کن':S.pay==='wallet'?(ps.enough?'پرداخت با کیف پول':`شارژ ${money(Math.ceil(ps.sh/10000)*10000)} و پرداخت`):'پرداخت آنلاین';
 return `${sbar()}<div class="scr">${hdr('تکمیل سفارش')}<div class="px" style="display:flex;flex-direction:column;gap:22px;padding-top:12px;padding-bottom:210px">
 ${S.prefs&&!S.editPrefs&&!needCar?`<div class="recap"><span class="m"><span>طبق سفارش قبلی</span><b>${S.method==='car'?'کنار خودرو'+(S.cars[S.carDef]?' ('+S.cars[S.carDef].m+')':''):'دریافت حضوری'} · ${tLabel(S.time)} · ${S.pay==='wallet'?'کیف پول':'کارت بانکی'}</b></span><button data-editprefs>تغییر</button></div>
 ${S.pay==='wallet'&&!ps.enough?`<div class="short tn">کیف پولت <b>${T(ps.sh)}</b> کم داره. با دکمه‌ی پایین کسری رو شارژ کن، سفارشت همون لحظه ثبت می‌شه.</div>`:''}
 ${S.busy?`<div class="busy">${i('clock')}شعبه الان شلوغه؛ آماده‌سازی حدود ۲۵ دقیقه طول می‌کشه.</div>`:''}`:`
 ${S.busy?`<div class="busy">${i('clock')}شعبه الان شلوغه؛ آماده‌سازی حدود ۲۵ دقیقه طول می‌کشه.</div>`:''}
 <div class="fld"><span class="lbl">روش تحویل</span>
  <button class="opt${S.method==='store'?' on':''}" data-method="store">${i('walk')}<span class="grow">دریافت حضوری<span class="sub">از پیشخوان تحویل بگیر</span></span><span class="radio${S.method==='store'?' on':''}"></span></button>
  ${S.method==='car'?`<div class="blk"><button class="bh" data-method="car">${i('car')}<span class="grow">تحویل کنار خودرو</span><span class="radio w on"></span></button>
   ${S.cars.length?`<div class="bi" style="padding:0;background:transparent;gap:4px">${S.cars.map((c,k)=>`<button class="carrow${k===S.carDef?' on':''}" data-defcar="${k}" ${k===S.carDef?'':'style="background:rgba(255,255,255,.08);color:#fff"'}><span style="color:${k===S.carDef?'var(--ink)':'#fff'}">${i('car32')}</span><span class="m"><b>${c.m} ${c.c}</b><span class="tn" style="${k===S.carDef?'':'color:#d8cfc6'}">${c.p[0]} ${c.p[1]} ${c.p[2]} · ایران ${c.p[3]}</span></span><span class="radio${k===S.carDef?' on':' w'}"></span></button>`).join('')}
   <button class="carrow" data-sheet="car" style="background:rgba(255,255,255,.08);color:#fff;justify-content:center;font-weight:600;font-size:14px;padding:12px">${i('add')}خودروی دیگر</button></div>`
   :`<button class="carrow addcar" data-sheet="car">${i('plusFill')}<span class="m"><b>افزودن خودرو</b><span>فقط یک بار؛ برای تحویل کنار خودرو</span></span>${i('chev')}</button>`}</div>`
  :`<button class="opt" data-method="car">${i('car')}<span class="grow">تحویل کنار خودرو<span class="sub">جلوی کافه، داخل خودرو تحویل بگیر</span></span><span class="radio"></span></button>`}
 </div>
 <div class="fld"><span class="lbl">زمان آماده بودن</span><div class="tgrid">${TIMES.map(([t,m],k)=>`<button class="tcard${S.time===k?' on':''}" data-time="${k}"><b>${t}</b><span class="tn">${k===0?(S.busy?'حدود ۲۵ دقیقه':'حدود ۱۰ دقیقه'):m?'حدود ساعت '+atMin(m):(S.ctime?'ساعت '+ft(S.ctime)+(S.rep?' · هر روز':''):'امروز یا هر روز')}</span></button>`).join('')}</div>
 ${S.time===3?`<div class="ctbox"><label class="trow"><span>ساعت آماده بودن</span><input type="time" id="ctime" value="${S.ctime||'08:00'}" step="900" aria-label="ساعت آماده بودن"></label>
  <button class="tgl rep" data-rep><span class="sw2${S.rep?' on':''}"><i></i></span><span class="t"><b>هر روز همین ساعت تکرار شه</b><span>سفارش خودکار؛ هر بار از کیف پول پرداخت می‌شه</span></span></button>
  ${S.rep?`<div class="days">${DAYS.map((d,k)=>`<button class="${S.rdays.includes(k)?'on':''}" data-rday="${k}" aria-label="${DAYN[k]}">${d}</button>`).join('')}</div><p class="hint">${daysTxt(S.rdays.slice().sort())}، ساعت ${ft(S.ctime||'08:00')}. ۳۰ دقیقه قبلش یادآوری می‌گیری و می‌تونی همون روز رو رد کنی. از پروفایل، «سفارش‌های خودکار» قابل تغییره.</p>`:''}</div>`:''}</div>
 <div class="fld"><span class="lbl">روش پرداخت</span>
  <button class="opt${S.pay==='wallet'?' on':''}" data-pay="wallet">${i('wallet')}<span class="grow">کیف پول<span class="bal"><span>موجودی:</span><b class="tn">${money(S.wallet)}</b><span>تومان</span></span></span><span class="radio${S.pay==='wallet'?' on':''}"></span></button>
  ${S.pay==='wallet'&&!ps.enough?`<div class="short tn">کیف پولت <b>${T(ps.sh)}</b> کم داره. با دکمه‌ی پایین کسری رو شارژ کن، سفارشت همون لحظه ثبت می‌شه.</div>`:''}
  <button class="opt${S.pay==='online'?' on':''}" data-pay="online">${i('dollar')}<span class="grow">کارت بانکی<span class="sub">درگاه آنلاین، همه‌ی کارت‌های شتابی</span></span><span class="radio${S.pay==='online'?' on':''}"></span></button>
 </div>`}</div></div>
 <div class="dock"><span class="pay-line tn">قابل پرداخت: <span>${T(payable())}</span></span><span class="earn">${fd(earn())} امتیاز دریافت می‌کنی${i('coins')}</span><button class="btn" data-place ${needCar?'disabled':''}>${btnTxt}${needCar?'':`<span class="sep"></span><span class="tn">${S.pay==='wallet'&&!ps.enough?T(Math.ceil(ps.sh/10000)*10000):T(payable())}</span>`}</button></div>`};

const wchip=()=>`<button class="wchip" data-go="wallet">${i('wallet')}<b class="tn">${money(S.wallet)}</b><em>تومان</em></button>`;
function rcptHTML(o){return `<div class="rcpt"><div class="row"><span>شماره سفارش</span><span class="tn">#${fd(o.id)}</span></div><hr>
 ${o.lines.map(l=>`<div class="it"><span class="r"><span class="th"><img src="${IMG[P[l.id].img]}" alt=""></span><span><b>${P[l.id].n}</b><span>${(l.add||[]).map(k=>'+ '+ADDONS[k][0]).join('، ')||P[l.id].desc||''}</span></span></span><span class="l tn">${fd(l.q)} تا<b>${T(l.t)}</b></span></div>`).join('')}
 ${o.note?`<hr><div class="row"><span>یادداشت</span><span>${o.note}</span></div>`:''}<hr>${o.disc?`<div class="row" style="color:#0d7a12"><span>تخفیف</span><span class="tn">−${T(o.disc)}</span></div>`:''}<div class="row"><span>پرداخت شد (${o.pay==='wallet'?'کیف پول':'کارت'})</span><span class="tn" style="font-size:16px;font-weight:600">${T(o.total)}</span></div><hr>
